# Actions are deliberately pinned to exact version tags rather than
# commit hashes, so the actions/unpinned-tag query only produces false
# positives here.
---
name: transcode CodeQL config
queries:
  - uses: security-and-quality
query-filters:
  - exclude:
      id: actions/unpinned-tag
