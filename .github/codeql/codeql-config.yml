# Excludes the actions/unpinned-tag query. The repository policy pins
# actions to exact version tags such as v1.2.3, not to commit hashes. So the
# query only produces false positives here.
---
name: transcode CodeQL config
queries:
  - uses: security-and-quality
query-filters:
  - exclude:
      id: actions/unpinned-tag
