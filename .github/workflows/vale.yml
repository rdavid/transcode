#
# Scopes the pull-requests:write permission below to the vale job alone
# (not the workflow default) so that vale-action can post inline review
# comments on the triggering pull request.
---
name: vale
'on':
  pull_request:
    paths: &paths
      - '**/*.md'
      - '**/*.adoc'
      - '**/README*'
      - .github/styles/**
      - .github/workflows/vale.yml
      - .vale.ini
      - Gemfile
      - Gemfile.lock
  push:
    branches: [master]
    paths: *paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: sh
jobs:
  vale:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      BUNDLE_ONLY: docs
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1.342.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: |
          BUNDLE_BIN="$RUNNER_TEMP/bin" bundle binstubs asciidoctor
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - uses: errata-ai/vale-action@v3.0.0
        with:
          fail_on_error: true
          files: README.adoc
