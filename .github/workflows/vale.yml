#
# The pull-requests:write permission below is scoped to the vale job
# alone (not the workflow default) so that vale-action can post inline
# review comments on the triggering pull request.
---
name: vale
'on':
  pull_request:
    paths: &paths
      - '**/*.md'
      - '**/*.adoc'
      - '**/README*'
      - .github/styles/**
      - .github/workflows/vale.yml
      - .vale.ini
  push:
    branches: [master]
    paths: *paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  vale:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes asciidoctor
      - uses: errata-ai/vale-action@v3.0.0
        with:
          fail_on_error: true
