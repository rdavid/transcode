# Enforces the Conventional Commits format required by AGENTS.md. On a pull
# request every commit ahead of the base branch is checked. The conform
# --base-branch flag needs the base ref present locally, which fetch-depth 0
# guarantees. The checkout pins to the PR head commit instead of the default
# refs/pull/*/merge ref. That synthetic merge commit's own message ("Merge
# <sha> into <sha>") is not a conventional commit and would otherwise fail the
# check on every pull request. On a direct push to master only the landed
# commit is checked. GITHUB_EVENT_NAME and GITHUB_BASE_REF are plain runner
# environment variables here, not template-expanded strings. So the branching
# stays free of template injection. conform has no stable release yet, so the
# pin below tracks the latest alpha. The binary is checked against its pinned
# SHA-256 sum before it runs.
---
name: conform
'on':
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: sh
jobs:
  conform:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: |
          srv=https://github.com/siderolabs/conform
          ver=0.1.0-alpha.31
          sum=344dd5fad42c61bf739491b490d453943d06f9aaed5488a738c0bbd4588b6914
          url=$srv/releases/download/v$ver/conform-linux-amd64
          curl \
            --fail \
            --location \
            --output conform \
            --retry 3 \
            --show-error \
            --silent \
            "$url"
          printf '%s  conform\n' "$sum" | sha256sum -c -
          chmod +x conform
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            ./conform enforce --base-branch "origin/$GITHUB_BASE_REF"
          else
            ./conform enforce --commit-ref HEAD
          fi
