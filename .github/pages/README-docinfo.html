<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
:root {
  --bg: #3f3f3f;
  --bg-panel: #2b2b2b;
  --fg: #dcdccc;
  --fg-muted: #7f9f7f;
  --accent-yellow: #f0dfaf;
  --accent-orange: #dfaf8f;
  --accent-cyan: #8cd0d3;
  --border: #4f4f4f;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
body {
  background: var(--bg) !important;
  color: var(--fg) !important;
  padding-top: 3.5em;
}
#header, #content { max-width: 900px; }
#footer { display: none; }
#header > h1:first-child { display: none; }
#site-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 1em;
  margin: 3em 0 0;
  padding: 1.5em 0 0.5em;
  border-top: 1px solid var(--border);
  font-family: var(--mono);
  font-size: 0.85em;
  color: var(--fg-muted);
}
#site-footer .footer-left {
  display: flex;
  align-items: center;
  gap: 0.6em;
}
#site-footer .footer-left img { display: block; }
#site-footer .footer-left a { color: var(--accent-orange) !important; }
#site-footer .footer-links { display: flex; gap: 1.4em; }
#site-footer .footer-links a { color: var(--fg-muted) !important; text-decoration: none; }
#site-footer .footer-links a:hover { color: var(--accent-orange) !important; }
#content p {
  text-align: justify;
  text-align-last: left;
  hyphens: auto;
}
h1, h2, h3, h4, h5, h6, #toctitle, #header > h1:first-child {
  font-family: var(--mono);
  color: var(--accent-yellow) !important;
  border-bottom-color: var(--border) !important;
  scroll-margin-top: 4.5em;
}
a { color: var(--accent-orange) !important; }
a:hover { color: var(--accent-cyan) !important; }
pre, code, tt { font-family: var(--mono); }
code {
  background: var(--bg-panel) !important;
  color: var(--accent-cyan) !important;
  hyphens: none;
}
.listingblock pre,
.literalblock pre,
.listingblock > .content > pre {
  background: var(--bg-panel) !important;
  color: var(--accent-cyan) !important;
  border: 1px solid var(--border);
}
#content #toc {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 1.5em;
  background: var(--bg) !important;
  border-top: none !important;
  border-left: none !important;
  border-right: none !important;
  border-bottom: 1px solid var(--border) !important;
  border-radius: 0;
  padding: 0.9em 56px 0.9em 15px !important;
  margin: 0 auto !important;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  max-width: 900px;
  z-index: 10;
}
#repo-link {
  position: fixed;
  top: 0;
  right: max(15px, calc(50vw - 450px + 15px));
  padding: 0.9em 0;
  font-size: 0.92em;
  z-index: 11;
}
#repo-link a {
  display: flex;
  align-items: center;
  height: 1.3em;
  color: var(--fg-muted);
}
#repo-link a:hover { color: var(--accent-orange); }
#repo-link svg { width: 1.15em; height: 1.15em; }
#toc::before {
  content: "transcode";
  flex: none;
  font-family: var(--mono);
  font-weight: 700;
  font-size: 0.95em;
  color: var(--accent-yellow);
  background: url("favicon.svg") no-repeat left center;
  background-size: 1.15em 1.15em;
  padding-left: 1.6em;
  line-height: 1.15em;
}
#toctitle { display: none; }
#toc ul.sectlevel1 {
  display: flex;
  flex-wrap: wrap;
  gap: 1.6em;
  list-style: none;
  margin: 0;
  padding: 0;
  font-family: var(--mono);
  font-size: 0.92em;
}
#toc ul.sectlevel1 > li { margin: 0; }
#toc a { color: var(--fg) !important; text-decoration: none; }
#toc a:hover { color: var(--accent-orange) !important; }
@media (max-width: 560px) {
  #content #toc { justify-content: flex-start; gap: 1em 1.5em; }
  #toc ul.sectlevel1 { gap: 1em 1.2em; font-size: 0.86em; }
}
hr, .sect1 + .sect1 { border-color: var(--border) !important; }
</style>
